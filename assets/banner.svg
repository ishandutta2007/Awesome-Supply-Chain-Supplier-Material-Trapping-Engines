<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    @keyframes pulseCircle {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.08); opacity: 0.55; }
    }
    @keyframes radarRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dataFlow {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes nodeBlink {
      0%, 100% { fill: #38bdf8; r: 4.5; }
      50% { fill: #f43f5e; r: 6.5; }
    }
    .radar-beam {
      transform-origin: 1040px 180px;
      animation: radarRotate 12s linear infinite;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dataFlow 3s linear infinite;
    }
    .pill-1 { animation: floatPill 4.5s ease-in-out infinite; }
    .pill-2 { animation: floatPill 5.2s ease-in-out 1s infinite; }
    .pill-3 { animation: floatPill 4.8s ease-in-out 2s infinite; }
    .pulsing-node { animation: nodeBlink 2.5s ease-in-out infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />

  <!-- Grid Overlay -->
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- DYNAMIC BACKGROUND LAYER: Radar and Multi-Tier Network (placed strictly in background/right-side) -->
  <g opacity="0.85">
    <!-- Concentric Monitoring Radars -->
    <circle cx="1040" cy="180" r="140" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2" />
    <circle cx="1040" cy="180" r="100" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="4, 4" />
    <circle cx="1040" cy="180" r="60" fill="url(#radar-glow)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="1040" cy="180" r="6" fill="#06b6d4" filter="url(#glow)" />

    <!-- Rotating Radar Sweep Line -->
    <g class="radar-beam">
      <line x1="1040" y1="180" x2="1180" y2="180" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
      <polygon points="1040,180 1175,155 1180,180" fill="url(#accent-glow)" opacity="0.4" />
    </g>

    <!-- Multi-Tier Supply Network Links -->
    <path class="flow-line" d="M 850 80 Q 940 120 1040 180" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
    <path class="flow-line" d="M 820 280 Q 920 240 1040 180" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.6" />
    <path class="flow-line" d="M 720 180 Q 880 160 1040 180" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.5" />
    <path class="flow-line" d="M 660 100 Q 750 80 850 80" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" />
    <path class="flow-line" d="M 640 260 Q 730 280 820 280" fill="none" stroke="#f43f5e" stroke-width="1.2" opacity="0.4" />

    <!-- Network Supplier Nodes -->
    <g>
      <!-- Tier 1 Core Hubs -->
      <circle cx="850" cy="80" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
      <circle cx="820" cy="280" r="7" fill="#0f766e" stroke="#14b8a6" stroke-width="2" />
      <circle cx="720" cy="180" r="8" fill="#4338ca" stroke="#818cf8" stroke-width="2" />
      
      <!-- Tier 2 / Sub-Tier Suppliers -->
      <circle cx="660" cy="100" r="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="640" cy="260" r="5" class="pulsing-node" stroke="#fb7185" stroke-width="1.5" />
      <circle cx="940" cy="120" r="4" fill="#38bdf8" opacity="0.7" />
      <circle cx="920" cy="240" r="4" fill="#14b8a6" opacity="0.7" />
    </g>
  </g>

  <!-- Subtle bottom telemetry wave -->
  <path d="M 0 340 Q 300 325 600 340 T 1200 335" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.25" />
  <path d="M 0 348 Q 200 340 400 348 T 800 345 T 1200 348" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.2" />

  <!-- FOREGROUND LAYER: Badges, Title & Subtitle (Guaranteed 100% visible and unhidden) -->
  <g transform="translate(60, 48)">
    <!-- Category Badge -->
    <g class="pill-1" filter="url(#badge-shadow)">
      <rect width="250" height="30" rx="15" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981" />
      <text x="28" y="20" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">SUPPLY CHAIN RISK ENGINES</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="86" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Awesome Supply Chain
    </text>
    <text x="0" y="126" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">
      Supplier &amp; Material Trapping Engines
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="166" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500">
      ⚡ Early-Warning Risk Intelligence  •  📦 Component Deficit Detection  •  🌐 Multi-Tier Visibility
    </text>

    <!-- Animated Feature Badges (Pills) -->
    <g transform="translate(0, 204)">
      <!-- Pill 1: Disruption Forecasting -->
      <g class="pill-1" filter="url(#badge-shadow)">
        <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
        <text x="14" y="22" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🛡️ Disruption Forecasting</text>
      </g>

      <!-- Pill 2: Deficit Trapping -->
      <g class="pill-2" transform="translate(194, 0)" filter="url(#badge-shadow)">
        <rect width="175" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1.2" />
        <text x="14" y="22" fill="#cffafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🔍 Material Deficit Alert</text>
      </g>

      <!-- Pill 3: Autonomous Agents -->
      <g class="pill-3" transform="translate(382, 0)" filter="url(#badge-shadow)">
        <rect width="170" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.2" />
        <text x="14" y="22" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🤖 Agentic Mitigation</text>
      </g>
    </g>
  </g>

  <!-- Border Accent Outline -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" />
</svg>
